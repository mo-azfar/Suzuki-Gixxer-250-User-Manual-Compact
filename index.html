<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover"
        />
        <title>Suzuki Gixxer 250 User Manual (Compact)</title>

        <style>
            :root {
                --bg: #0b0d10;
                --panel: #0f1318;
                --text: #e7eef7;
                --muted: #9fb0c3;

                --radius: 18px;
                --shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
                --drawerW: 300px;
                --maxAppW: 1200px;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                background: radial-gradient(
                    1200px 800px at 30% 10%,
                    #101827 0%,
                    var(--bg) 55%,
                    #07080a 100%
                );
                color: var(--text);
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    Helvetica,
                    Arial;
            }

            .app {
                width: min(90vw, var(--maxAppW));
                height: min(92vh, 920px);
                margin: 4vh auto;
                background: var(--panel);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                overflow: hidden;
                position: relative;
                display: flex;
                flex-direction: column;
            }

            @media (max-width: 720px) {
                .app {
                    width: 100vw;
                    height: 100dvh;
                    height: 100svh;
                    margin: 0;
                    border-radius: 0;
                    border: none;
                    box-shadow: none;
                }
                :root {
                    --drawerW: 88vw;
                }
            }

            .topbar {
                position: sticky;
                top: 0;
                z-index: 40;
                height: 56px;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 12px;
                background: rgba(15, 19, 24, 0.92);
                backdrop-filter: blur(10px);
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .btn-icon {
                width: 44px;
                height: 44px;
                border-radius: 14px;
                border: 1px solid rgba(90, 169, 255, 0.55);
                background: rgba(90, 169, 255, 0.18);
                color: var(--text);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
                flex: 0 0 auto;
            }
            .btn-icon:hover {
                border-color: rgba(90, 169, 255, 0.75);
                background: rgba(90, 169, 255, 0.26);
            }
            .btn-icon:active {
                transform: translateY(1px);
            }

            .brand {
                display: flex;
                flex-direction: column;
                line-height: 1.05;
                min-width: 0;
                flex: 1 1 auto;
            }
            .brand b {
                font-size: 14px;
                letter-spacing: 0.2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .brand span {
                font-size: 12px;
                color: var(--muted);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* ===== Topbar Search (NEW) ===== */
            .topsearch {
                position: relative;
                flex: 0 1 420px;
                min-width: 140px;
            }
            .topsearch input {
                width: 100%;
                border-radius: 14px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                background: rgba(255, 255, 255, 0.04);
                color: var(--text);
                padding: 10px 12px;
                font-size: 13px;
                outline: none;
            }
            .topsearch input::placeholder {
                color: rgba(159, 176, 195, 0.75);
            }

            .searchdrop {
                position: absolute;
                top: calc(100% + 8px);
                left: 0;
                right: 0;
                background: rgba(18, 22, 28, 0.98);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 14px;
                box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
                max-height: 55vh;
                overflow: auto;
                z-index: 85;
                padding: 8px;
            }
            .searchdrop[hidden] {
                display: none;
            }

            .drop-item {
                display: block;
                padding: 10px 10px;
                border-radius: 12px;
                text-decoration: none;
                color: var(--text);
                border: 1px solid transparent;
                background: rgba(255, 255, 255, 0.02);
                margin-bottom: 8px;
                cursor: pointer;
            }
            .drop-item:hover {
                border-color: rgba(90, 169, 255, 0.35);
                background: rgba(90, 169, 255, 0.1);
            }
            .drop-item small {
                display: block;
                color: var(--muted);
                font-size: 11px;
                margin-top: 4px;
            }
            .drop-pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 10px;
                color: var(--muted);
                border: 1px solid rgba(255, 255, 255, 0.1);
                background: rgba(255, 255, 255, 0.03);
                padding: 2px 6px;
                border-radius: 999px;
                margin-top: 6px;
            }

            main {
                flex: 1;
                overflow: auto;
                padding: 16px;
            }

            .card {
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.06);
                border-radius: 16px;
                padding: 14px;
                margin-bottom: 12px;
            }
            .title {
                font-size: 16px;
                margin: 0 0 8px;
                letter-spacing: 0.2px;
            }
            .meta {
                margin: 0 0 10px;
                color: var(--muted);
                font-size: 12px;
            }
            .muted {
                color: var(--muted);
            }

            .chip {
                display: inline-flex;
                align-items: center;
                padding: 4px 8px;
                border-radius: 999px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                background: rgba(255, 255, 255, 0.04);
                color: var(--muted);
                font-size: 11px;
                margin-right: 6px;
                margin-bottom: 6px;
            }

            .kv {
                display: grid;
                gap: 8px;
                margin-top: 10px;
            }
            .kv-row {
                display: flex;
                justify-content: space-between;
                gap: 10px;
                padding: 10px 10px;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.06);
                background: rgba(255, 255, 255, 0.02);
                font-size: 13px;
            }
            .kv-row span:first-child {
                color: var(--muted);
            }

            ul {
                margin: 6px 0 0;
                padding-left: 18px;
            }
            li {
                margin: 6px 0;
            }

            .accordion details {
                border: 1px solid rgba(255, 255, 255, 0.06);
                background: rgba(255, 255, 255, 0.02);
                border-radius: 14px;
                margin-bottom: 10px;
                overflow: hidden;
            }
            .accordion summary {
                list-style: none;
                cursor: pointer;
                padding: 12px 12px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                user-select: none;
            }
            .accordion summary::-webkit-details-marker {
                display: none;
            }
            .accordion .sum-title {
                font-size: 14px;
                letter-spacing: 0.2px;
            }
            .accordion .chev {
                width: 10px;
                height: 10px;
                border-right: 2px solid rgba(159, 176, 195, 0.9);
                border-bottom: 2px solid rgba(159, 176, 195, 0.9);
                transform: rotate(-45deg);
                transition: transform 0.15s ease;
                flex: 0 0 auto;
                margin-left: 6px;
            }
            .accordion details[open] .chev {
                transform: rotate(45deg);
            }
            .accordion .acc-body {
                padding: 0 12px 12px;
            }

            .overlay {
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.18s ease;
                z-index: 60;
            }
            .overlay.show {
                opacity: 1;
                pointer-events: auto;
            }

            .drawer {
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                width: var(--drawerW);
                background: rgba(18, 22, 28, 0.98);
                border-right: 1px solid rgba(255, 255, 255, 0.08);
                transform: translateX(-102%);
                transition: transform 0.18s ease;
                display: flex;
                flex-direction: column;
                padding: 12px 10px;
                z-index: 70;
            }
            .drawer.open {
                transform: translateX(0);
            }

            .drawer-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 4px 2px 10px;
            }
            .drawer-title {
                font-size: 11px;
                color: var(--muted);
                font-weight: 700;
                letter-spacing: 0.6px;
                text-transform: uppercase;
            }
            .drawer-list {
                overflow: auto;
                padding-right: 2px;
            }

            .nav-item {
                display: block;
                padding: 10px 10px;
                border-radius: 12px;
                color: var(--text);
                text-decoration: none;
                font-size: 13px;
                border: 1px solid transparent;
                margin-bottom: 8px;
                background: rgba(255, 255, 255, 0.02);
            }
            .nav-item:hover {
                border-color: rgba(90, 169, 255, 0.35);
                background: rgba(90, 169, 255, 0.1);
            }
            .nav-item.active {
                border-color: rgba(90, 169, 255, 0.55);
                background: rgba(90, 169, 255, 0.18);
            }
            .nav-item small {
                display: block;
                color: var(--muted);
                font-size: 11px;
                margin-top: 4px;
            }

            mark {
                background: rgba(90, 169, 255, 0.22);
                color: var(--text);
                padding: 0 2px;
                border-radius: 4px;
            }

            .imgref {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin-left: 6px;
                padding: 2px 8px;
                border-radius: 999px;
                border: 1px solid rgba(90, 169, 255, 0.45);
                background: rgba(90, 169, 255, 0.12);
                color: var(--text);
                cursor: pointer;
                font-size: 12px;
                line-height: 1;
                vertical-align: middle;
                -webkit-tap-highlight-color: transparent;
            }
            .imgref:hover {
                border-color: rgba(90, 169, 255, 0.75);
                background: rgba(90, 169, 255, 0.18);
            }
            .imgref svg {
                opacity: 0.95;
                flex: 0 0 auto;
            }
            .imgref .imgref-label {
                color: rgba(231, 238, 247, 0.92);
                font-size: 11px;
            }

            .inline-img {
                display: block;
                max-width: 100%;
                border-radius: 12px;
                margin: 12px auto;
                cursor: pointer;
                border: 1px solid rgba(255,255,255,0.04);
                background: rgba(255,255,255,0.02);
            }

            .lightbox-overlay {
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.65);
                display: none;
                align-items: center;
                justify-content: center;
                padding: 16px;
                z-index: 90;
            }
            .lightbox-overlay.show {
                display: flex;
            }

            .lightbox-panel {
                position: relative;
                max-width: 80vw;
                max-height: 80vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .lightbox-img {
                max-width: 80vw;
                max-height: 80vh;
                width: auto;
                height: auto;
                border-radius: 16px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                background: rgba(255, 255, 255, 0.02);
            }

            .lightbox-close {
                position: absolute;
                top: -10px;
                right: -10px;
                width: 36px;
                height: 36px;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.12);
                background: rgba(18, 22, 28, 0.95);
                color: var(--text);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .lightbox-close:hover {
                border-color: rgba(90, 169, 255, 0.35);
                background: rgba(90, 169, 255, 0.1);
            }

            .icon {
                width: 1em;
                height: 1em;
                vertical-align: -0.15em;
                margin-right: 0.35em;
                opacity: 0.95;
            }
        </style>
    </head>

    <body>
        <div
            class="app"
            role="application"
            aria-label="Suzuki Gixxer 250 Compact Manual"
        >
            <header class="topbar">
                <button
                    id="menuBtn"
                    class="btn-icon"
                    aria-label="Open menu"
                    aria-controls="drawer"
                    aria-expanded="false"
                >
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        aria-hidden="true"
                    >
                        <path
                            d="M4 7h16M4 12h16M4 17h16"
                            stroke="currentColor"
                            stroke-width="2.8"
                            stroke-linecap="round"
                        />
                    </svg>
                </button>

                <div class="brand">
                    <b id="appTitle">Compact Manual</b>
                    <span id="appSubtitle">Home</span>
                </div>

                <!-- NEW: Topbar search -->
                <div class="topsearch" aria-label="Search">
                    <input
                        id="topSearch"
                        type="search"
                        placeholder="Search…"
                        autocomplete="off"
                    />
                    <div id="topSearchDrop" class="searchdrop" hidden></div>
                </div>
            </header>

            <main id="content" aria-live="polite"></main>

            <div id="overlay" class="overlay" aria-hidden="true"></div>

            <aside id="drawer" class="drawer" aria-label="Navigation menu">
                <div class="drawer-header">
                    <div class="drawer-title">Topics</div>
                    <button
                        id="closeBtn"
                        class="btn-icon"
                        aria-label="Close menu"
                    >
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >
                            <path
                                d="M6 6l12 12M18 6L6 18"
                                stroke="currentColor"
                                stroke-width="2.6"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>
                </div>

                <!-- REMOVED: navSearch input -->
                <div id="nav" class="drawer-list"></div>
            </aside>

            <div id="lightbox" class="lightbox-overlay" aria-hidden="true">
                <div
                    class="lightbox-panel"
                    role="dialog"
                    aria-modal="true"
                    aria-label="Image viewer"
                >
                    <button
                        id="lightboxClose"
                        class="lightbox-close"
                        aria-label="Close image"
                    >
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >
                            <path
                                d="M6 6l12 12M18 6L6 18"
                                stroke="currentColor"
                                stroke-width="2.6"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>
                    <img id="lightboxImg" class="lightbox-img" alt="" />
                </div>
            </div>
        </div>

        <script>
            const DATA_URL = "data/manual.json";

            let manual = null;
            let topicsById = new Map();
            let orderedTopics = [];

            const drawer = document.getElementById("drawer");
            const overlay = document.getElementById("overlay");
            const menuBtn = document.getElementById("menuBtn");
            const closeBtn = document.getElementById("closeBtn");
            const nav = document.getElementById("nav");
            const subtitle = document.getElementById("appSubtitle");

            // NEW: Top search refs
            const topSearch = document.getElementById("topSearch");
            const topSearchDrop = document.getElementById("topSearchDrop");

            const lightbox = document.getElementById("lightbox");
            const lightboxImg = document.getElementById("lightboxImg");
            const lightboxClose = document.getElementById("lightboxClose");

            const ICONS = {
                warning: `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 1 22h22L12 2z" fill="currentColor"/><path d="M12 8v6" stroke="#0f1318" stroke-width="2" stroke-linecap="round"/><path d="M12 17h.01" stroke="#0f1318" stroke-width="4" stroke-linecap="round"/></svg>`,
                info: `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z" fill="currentColor"/><path d="M12 10v7" stroke="#0f1318" stroke-width="2" stroke-linecap="round"/><path d="M12 7h.01" stroke="#0f1318" stroke-width="4" stroke-linecap="round"/></svg>`,
            };

            function esc(s) {
                return String(s ?? "")
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            function getRoute() {
                const hash = location.hash || "#/home";
                const route = hash.replace(/^#\//, "");
                return route || "home";
            }

            function openDrawer() {
                drawer.classList.add("open");
                overlay.classList.add("show");
                menuBtn.setAttribute("aria-expanded", "true");
            }

            function closeDrawer() {
                drawer.classList.remove("open");
                overlay.classList.remove("show");
                menuBtn.setAttribute("aria-expanded", "false");
            }

            overlay.addEventListener("click", closeDrawer);
            menuBtn.addEventListener("click", openDrawer);
            closeBtn.addEventListener("click", closeDrawer);

            function renderMarkup(input) {
                let s = String(input ?? "");
                s = esc(s);

                s = s.replace(/\n/g, "<br>");
                s = s.replace(/`([^`]+?)`/g, "<code>$1</code>");
                s = s.replace(/__(.+?)__/g, "<u>$1</u>");
                s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
                s = s.replace(/(^|[^*])\*([^*]+?)\*(?!\*)/g, "$1<em>$2</em>");

                s = s.replace(/\[icon:([a-z0-9_-]+)\]/gi, (m, name) => {
                    const key = String(name).toLowerCase();
                    return ICONS[key]
                        ? ICONS[key]
                        : `<span class="muted">[icon:${esc(key)}]</span>`;
                });

                return s;
            }

            function openLightbox(src, alt = "") {
                lightboxImg.src = src;
                lightboxImg.alt = alt || "Image";
                lightbox.classList.add("show");
                lightbox.setAttribute("aria-hidden", "false");
            }
            function closeLightbox() {
                lightbox.classList.remove("show");
                lightbox.setAttribute("aria-hidden", "true");
                lightboxImg.src = "";
                lightboxImg.alt = "";
            }

            lightbox.addEventListener("click", (e) => {
                if (e.target === lightbox) closeLightbox();
            });
            lightboxClose.addEventListener("click", closeLightbox);

            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    if (lightbox.classList.contains("show")) closeLightbox();
                    else {
                        closeDrawer();
                        hideTopSearchDrop();
                    }
                }
            });

            function setActive(route) {
                document.querySelectorAll(".nav-item").forEach((a) => {
                    a.classList.toggle("active", a.dataset.route === route);
                });
            }

            function getRenderPlan(topic) {
                const hasSections =
                    Array.isArray(topic.sections) && topic.sections.length > 0;
                const hasData =
                    Array.isArray(topic.data) && topic.data.length > 0;

                if (Array.isArray(topic.blocks) && topic.blocks.length) {
                    const plan = topic.blocks
                        .map((b) => b?.type)
                        .filter(
                            (t) =>
                                (t === "sections" && hasSections) ||
                                (t === "data" && hasData),
                        );
                    if (hasSections && !plan.includes("sections"))
                        plan.push("sections");
                    if (hasData && !plan.includes("data")) plan.push("data");
                    return plan;
                }

                const plan = [];
                if (hasSections) plan.push("sections");
                if (hasData) plan.push("data");
                return plan;
            }

            function imgPathByToken(token) {
                const key = String(token || "").trim();
                return manual?.images?.[key] || "";
            }

            function renderInlineImagesFromText(raw) {
                                const s = String(raw ?? "");
                                const re = /\[(INLINEIMG|IMG)#([A-Za-z0-9_-]+)\]/g;

                                let out = "";
                                let last = 0;
                                let m;

                                while ((m = re.exec(s)) !== null) {
                                        out += renderMarkup(s.slice(last, m.index));

                                        const type = m[1];
                                        const key = m[2];
                                        const src = imgPathByToken(key);

                                                if (src) {
                                                if (type === "INLINEIMG") {
                                                        out += `\n            <br/>\n            <img\n              src="${esc(src)}"\n              class="inline-img"\n              data-imgkey="${esc(key)}"\n              alt="Image ${esc(key)}"\n              title="Open image"\n            />\n            <br/>\n          `;
                                                } else {
                                                        out += `
                        <button
                            type="button"
                            class="imgref"
                            data-imgkey="${esc(key)}"
                            data-imgsrc="${esc(src)}"
                            aria-label="Open image ${esc(key)}"
                            title="Open image"
                        >
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7Z"
                                    stroke="currentColor" stroke-width="2"/>
                                <path d="M8 14l2-2 3 3 3-4 3 4"
                                    stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M8.5 9.5h.01"
                                    stroke="currentColor" stroke-width="4"
                                    stroke-linecap="round"/>
                            </svg>
                            <span class="imgref-label">Image</span>
                        </button>
                    `;
                                                }
                                        } else {
                                                out += `<span class="muted">[missing image: ${esc(key)}]</span>`;
                                        }

                                        last = m.index + m[0].length;
                                }

                                out += renderMarkup(s.slice(last));
                                return out;
            }

            function wireInlineImageLightbox() {
                const root = document.getElementById("content");
                if (root.dataset.imgrefBound === "1") return;
                root.dataset.imgrefBound = "1";

                root.addEventListener("click", (e) => {
                    const target = e.target.closest("button.imgref, img.inline-img");
                    if (!target) return;

                    const src = target.dataset.imgsrc || target.src || "";
                    const key = target.dataset.imgkey || "";
                    if (src) openLightbox(src, `Image ${key}`);
                });
            }

            function renderSectionsBlock(topic) {
                if (!topic.sections?.length) return "";

                return `
        <section class="card accordion" data-accordion>
          ${topic.sections
              .map(
                  (sec, idx) => `
            <details ${sec.open === false ? "" : "open"} data-acc-item data-sec-index="${idx}">
              <summary>
                <span class="sum-title">${renderMarkup(sec.heading)}</span>
                <span class="chev" aria-hidden="true"></span>
              </summary>
              <div class="acc-body">
                ${sec.text ? `<p class="muted">${renderInlineImagesFromText(sec.text)}</p>` : ""}
                ${
                    sec.bullets?.length
                        ? `<ul>${sec.bullets.map((b) => `<li>${renderInlineImagesFromText(b)}</li>`).join("")}</ul>`
                        : ""
                }
              </div>
            </details>
          `,
              )
              .join("")}
        </section>
      `;
            }

            function renderDataBlock(topic) {
                if (!topic.data?.length) return "";

                return `
        <section class="card">
          <div class="kv">
            ${topic.data
                .map(
                    (kv) => `
              <div class="kv-row">
                <span>${renderMarkup(kv.label)}</span>
                <span>${renderMarkup(kv.value)}</span>
              </div>
            `,
                )
                .join("")}
          </div>
        </section>
      `;
            }

            function renderTopic(topic) {
                if (!topic) {
                    subtitle.textContent = "Not found";
                    return `
          <section class="card">
            <h1 class="title">Not found</h1>
            <p class="muted">This topic doesn’t exist.</p>
          </section>
        `;
                }

                subtitle.textContent = topic.title || topic.id;

                const chips = [
                    topic.applicable_models?.length
                        ? `<span class="chip">Models: ${esc(topic.applicable_models.join(", "))}</span>`
                        : "",
                ]
                    .filter(Boolean)
                    .join("");

                const header = `
        <section class="card">
          <h1 class="title">${esc(topic.title)}</h1>
          <p class="meta">${chips}</p>
          ${topic.summary ? `<p class="muted">${renderMarkup(topic.summary)}</p>` : ""}
        </section>
      `;

                const plan = getRenderPlan(topic);
                const blocks = plan
                    .map((t) => {
                        if (t === "sections") return renderSectionsBlock(topic);
                        if (t === "data") return renderDataBlock(topic);
                        return "";
                    })
                    .join("");

                return header + blocks;
            }

            function wireContentAccordions() {
                document.querySelectorAll("[data-accordion]").forEach((acc) => {
                    const items = Array.from(
                        acc.querySelectorAll("details[data-acc-item]"),
                    );
                    items.forEach((d) => {
                        d.addEventListener("toggle", () => {
                            if (!d.open) return;
                            items.forEach((other) => {
                                if (other !== d) other.open = false;
                            });
                        });
                    });
                });
            }

            function render() {
                const route = getRoute();
                const topic = topicsById.get(route);
                document.getElementById("content").innerHTML =
                    renderTopic(topic);
                setActive(route);
                wireContentAccordions();
                wireInlineImageLightbox();
            }

            function topicSearchText(topic) {
                const parts = [];
                parts.push(topic.title, topic.summary);

                // data
                if (Array.isArray(topic.data)) {
                    for (const kv of topic.data) parts.push(kv.label, kv.value);
                }

                // sections
                if (Array.isArray(topic.sections)) {
                    for (const sec of topic.sections) {
                        parts.push(sec.heading);
                        if (Array.isArray(sec.bullets))
                            parts.push(...sec.bullets);
                        if (sec.text) parts.push(sec.text);
                    }
                }
                return parts.filter(Boolean).join(" \n ");
            }

            function makeSnippet(text, q) {
                const lower = text.toLowerCase();
                const idx = lower.indexOf(q);
                if (idx === -1) return "";
                const start = Math.max(0, idx - 35);
                const end = Math.min(text.length, idx + q.length + 45);
                let snip = text.slice(start, end).trim();
                if (start > 0) snip = "…" + snip;
                if (end < text.length) snip = snip + "…";
                return snip;
            }

            function highlightSnippet(snip, q) {
                const re = new RegExp(
                    q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
                    "ig",
                );
                return esc(snip).replace(re, (m) => `<mark>${esc(m)}</mark>`);
            }

            function renderNavList(items, route) {
                nav.innerHTML =
                    items
                        .map((item) => {
                            const t = item.topic;
                            return `
          <a class="nav-item" href="#/${esc(t.id)}" data-route="${esc(t.id)}">
            ${esc(t.title)}
            ${t.summary ? `<small>${esc(t.summary)}</small>` : ""}
          </a>
        `;
                        })
                        .join("") ||
                    `<p class="muted" style="padding:8px 6px;">No topics.</p>`;

                setActive(route);
                nav.querySelectorAll("a.nav-item").forEach((a) =>
                    a.addEventListener("click", () => closeDrawer()),
                );
            }

            function renderNavDefault() {
                const route = getRoute();
                const items = orderedTopics.map((t) => ({ topic: t }));
                renderNavList(items, route);
            }

            /* ===== Top Search Logic (NEW) ===== */

            function hideTopSearchDrop() {
                topSearchDrop.hidden = true;
                topSearchDrop.innerHTML = "";
            }

            function openSectionByIndex(sectionIndex) {
                if (sectionIndex == null) return;

                const detailsList = Array.from(
                    document.querySelectorAll(
                        "[data-accordion] details[data-acc-item]",
                    ),
                );
                const target = detailsList[sectionIndex];
                if (!target) return;

                // open target, close others (single open)
                detailsList.forEach((d) => (d.open = d === target));
                target.scrollIntoView({ behavior: "smooth", block: "start" });
            }

            function findMatches(qRaw) {
                const q = qRaw.trim().toLowerCase();
                if (!q) return [];

                const results = [];

                for (const t of orderedTopics) {
                    const titleSummary = [t.title, t.summary]
                        .filter(Boolean)
                        .join(" — ");
                    if (titleSummary.toLowerCase().includes(q)) {
                        results.push({
                            topic: t,
                            kind: "title/summary",
                            hint: titleSummary,
                            sectionIndex: null,
                        });
                        continue;
                    }

                    // sections: pick first matching section index
                    if (Array.isArray(t.sections)) {
                        for (let i = 0; i < t.sections.length; i++) {
                            const sec = t.sections[i];
                            const hay = [
                                sec.heading,
                                sec.text,
                                ...(Array.isArray(sec.bullets)
                                    ? sec.bullets
                                    : []),
                            ]
                                .filter(Boolean)
                                .join("\n");

                            if (hay.toLowerCase().includes(q)) {
                                results.push({
                                    topic: t,
                                    kind: "section",
                                    hint:
                                        makeSnippet(hay, q) ||
                                        sec.heading ||
                                        t.summary ||
                                        "",
                                    sectionIndex: i,
                                });
                                break;
                            }
                        }
                        if (results[results.length - 1]?.topic?.id === t.id)
                            continue;
                    }

                    // data
                    if (Array.isArray(t.data)) {
                        const hay = t.data
                            .map((kv) => `${kv.label}: ${kv.value}`)
                            .join("\n");
                        if (hay.toLowerCase().includes(q)) {
                            results.push({
                                topic: t,
                                kind: "data",
                                hint: makeSnippet(hay, q) || t.summary || "",
                                sectionIndex: null,
                            });
                        }
                    }
                }

                const weight = (k) =>
                    k === "title/summary" ? 0 : k === "section" ? 1 : 2;
                results.sort(
                    (a, b) =>
                        weight(a.kind) - weight(b.kind) ||
                        a.topic.title.localeCompare(b.topic.title),
                );
                return results.slice(0, 12);
            }

            function showTopSearchDrop(items, qStr) {
                if (!items.length) {
                    hideTopSearchDrop();
                    return;
                }

                topSearchDrop.hidden = false;
                topSearchDrop.innerHTML = items
                    .map((r) => {
                        const hint = r.hint || r.topic.summary || "";
                        const small = qStr
                            ? highlightSnippet(String(hint), qStr.trim())
                            : esc(hint);
                        const pill = `<span class="drop-pill">${esc(r.kind)}</span>`;
                        const secAttr =
                            r.sectionIndex != null
                                ? ` data-sec="${r.sectionIndex}"`
                                : "";

                        return `
          <div class="drop-item" role="option" tabindex="0" data-topic="${esc(r.topic.id)}"${secAttr}>
            ${esc(r.topic.title)}
            <small>${small}</small>
            ${pill}
          </div>
        `;
                    })
                    .join("");
            }

            // click outside closes dropdown
            document.addEventListener("click", (e) => {
                if (e.target.closest(".topsearch")) return;
                hideTopSearchDrop();
            });

            topSearchDrop.addEventListener("click", (e) => {
                const item = e.target.closest(".drop-item");
                if (!item) return;

                const topicId = item.dataset.topic;
                const sec =
                    item.dataset.sec != null ? Number(item.dataset.sec) : null;

                location.hash = `#/${topicId}`;
                hideTopSearchDrop();
                topSearch.blur();

                setTimeout(() => openSectionByIndex(sec), 0);
            });

            topSearch.addEventListener("input", () => {
                const q = topSearch.value;
                const items = findMatches(q);
                showTopSearchDrop(items, q);
            });

            topSearch.addEventListener("focus", () => {
                const q = topSearch.value;
                if (q.trim()) {
                    showTopSearchDrop(findMatches(q), q);
                }
            });

            topSearch.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    hideTopSearchDrop();
                    return;
                }
                if (e.key !== "Enter") return;

                const first = topSearchDrop.querySelector(".drop-item");
                if (!first) return;

                const topicId = first.dataset.topic;
                const sec =
                    first.dataset.sec != null
                        ? Number(first.dataset.sec)
                        : null;

                location.hash = `#/${topicId}`;
                hideTopSearchDrop();
                topSearch.blur();

                setTimeout(() => openSectionByIndex(sec), 0);
            });

            async function init() {
                const res = await fetch(DATA_URL, { cache: "no-store" });
                if (!res.ok)
                    throw new Error(
                        `Failed to load ${DATA_URL}: ${res.status}`,
                    );
                manual = await res.json();

                orderedTopics = (manual.topics || []).filter(
                    (t) => t && t.disabled !== true,
                );
                topicsById = new Map(orderedTopics.map((t) => [t.id, t]));

                document.getElementById("appTitle").textContent =
                    `${manual.model}`;

                if (!topicsById.has(getRoute())) location.hash = "#/home";
                if (!location.hash) location.hash = "#/home";

                renderNavDefault();

                window.addEventListener("hashchange", () => {
                    render();
                    setActive(getRoute());
                    hideTopSearchDrop();
                });

                render();
                closeDrawer();
                hideTopSearchDrop();
            }

            init().catch((err) => {
                document.getElementById("content").innerHTML = `
        <section class="card">
          <h1 class="title">Error</h1>
          <p class="muted">${esc(err.message)}</p>
          <p class="muted">Make sure <code>data/manual.json</code> exists and GitHub Pages is serving it.</p>
        </section>
      `;
            });
        </script>
    </body>
</html>
