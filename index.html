<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>GSX250RL Micro Manual</title>
  <style>
    :root{
      --bg: #0b0d10;
      --panel: #12161c;
      --panel2:#0f1318;
      --text:#e7eef7;
      --muted:#9fb0c3;
      --border:#233041;
      --accent:#5aa9ff;
      --phoneW: 390px;   /* iPhone 12/13/14-ish */
      --phoneH: 844px;
      --navW: 140px;     /* slim left nav like a mobile app drawer */
      --radius: 18px;
      --shadow: 0 12px 40px rgba(0,0,0,.45);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: radial-gradient(1200px 800px at 30% 10%, #101827 0%, var(--bg) 55%, #07080a 100%);
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }

    /* Always-mobile presentation: a centered "phone canvas" */
    .phone{
      width:min(100%, var(--phoneW));
      height:min(100vh - 32px, var(--phoneH));
      background: var(--panel2);
      border:1px solid rgba(255,255,255,.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      position:relative;
    }

    .topbar{
      height:52px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0));
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .brand{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }
    .brand b{ font-size:14px; letter-spacing:.2px; }
    .brand span{ font-size:12px; color:var(--muted); }

    .layout{
      flex:1;
      display:flex;
      min-height:0; /* allow children to scroll */
    }

    /* Left nav */
    nav{
      width: var(--navW);
      background: rgba(255,255,255,.03);
      border-right:1px solid rgba(255,255,255,.06);
      padding:12px 10px;
      overflow:auto;
    }
    nav h3{
      margin:0 0 10px;
      font-size:11px;
      color:var(--muted);
      font-weight:600;
      letter-spacing:.5px;
      text-transform:uppercase;
    }
    .nav-item{
      display:block;
      padding:10px 10px;
      border-radius:12px;
      color:var(--text);
      text-decoration:none;
      font-size:13px;
      border:1px solid transparent;
      margin-bottom:8px;
      background: rgba(255,255,255,.02);
    }
    .nav-item:hover{
      border-color: rgba(90,169,255,.35);
      background: rgba(90,169,255,.10);
    }
    .nav-item.active{
      border-color: rgba(90,169,255,.55);
      background: rgba(90,169,255,.18);
    }
    .nav-item small{
      display:block;
      color:var(--muted);
      font-size:11px;
      margin-top:4px;
    }

    /* Right container */
    main{
      flex:1;
      padding:14px;
      overflow:auto;
    }
    .card{
      background: rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);
      border-radius:16px;
      padding:14px;
      margin-bottom:12px;
    }
    .title{
      font-size:16px;
      margin:0 0 8px;
      letter-spacing:.2px;
    }
    .meta{
      margin:0 0 10px;
      color:var(--muted);
      font-size:12px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color:var(--muted);
      font-size:11px;
      margin-right:6px;
    }
    ul{ margin:8px 0 0 18px; color:var(--text); }
    li{ margin:6px 0; }
    .muted{ color:var(--muted); }

    /* Keep it "mobile-like" even on wide screens */
    @media (min-width: 520px){
      body{ padding:24px; }
    }
  </style>
</head>
<body>
  <div class="phone" role="application" aria-label="GSX250RL Micro Manual">
    <header class="topbar">
      <div class="brand">
        <b>GSX250RL Micro Manual</b>
        <span>Mobile-first • GitHub Pages</span>
      </div>
    </header>

    <div class="layout">
      <nav aria-label="Topics">
        <h3>Topics</h3>

        <a class="nav-item" href="#/home" data-route="home">
          Home
          <small>Overview</small>
        </a>

        <a class="nav-item" href="#/engine-oil" data-route="engine-oil">
          Engine Oil
          <small>Type & capacity</small>
        </a>

        <a class="nav-item" href="#/tyre-pressure" data-route="tyre-pressure">
          Tyre Pressure
          <small>Front / rear</small>
        </a>

        <a class="nav-item" href="#/frame-cover" data-route="frame-cover">
          Frame Cover
          <small>Open / remove</small>
        </a>
      </nav>

      <main id="content" aria-live="polite"></main>
    </div>
  </div>

  <script>
    // Minimal router (hash-based) + content placeholders.
    // Later: replace `pages` with JSON-driven rendering.
    const pages = {
      home: () => `
        <section class="card">
          <h1 class="title">Welcome</h1>
          <p class="meta">
            <span class="chip">Model: GSX250RL</span>
            <span class="chip">Source: Suzuki PDF</span>
          </p>
          <p class="muted">
            This is a task-based micro manual. Pick a topic on the left.
          </p>
        </section>

        <section class="card">
          <h2 class="title">How it will work</h2>
          <ul>
            <li>Topic list (left) comes from JSON.</li>
            <li>Clicking a topic updates the URL (<code>#/topic-id</code>).</li>
            <li>Content renders in the right container.</li>
          </ul>
        </section>
      `,

      "engine-oil": () => `
        <section class="card">
          <h1 class="title">Engine Oil</h1>
          <p class="meta"><span class="chip">Coming from JSON</span></p>
          <ul>
            <li><b>Oil type:</b> (placeholder)</li>
            <li><b>Standard:</b> (placeholder)</li>
            <li><b>Capacity:</b> (placeholder)</li>
          </ul>
          <p class="muted" style="margin-top:10px;">
            Later we’ll inject the real values and add “source pages” references.
          </p>
        </section>
      `,

      "tyre-pressure": () => `
        <section class="card">
          <h1 class="title">Tyre Pressure</h1>
          <p class="meta"><span class="chip">Coming from JSON</span></p>
          <ul>
            <li><b>Front:</b> (placeholder)</li>
            <li><b>Rear:</b> (placeholder)</li>
            <li><b>With passenger/cargo:</b> (placeholder)</li>
          </ul>
        </section>
      `,

      "frame-cover": () => `
        <section class="card">
          <h1 class="title">Frame Cover</h1>
          <p class="meta"><span class="chip">Coming from JSON</span></p>
          <ul>
            <li>Step 1: (placeholder)</li>
            <li>Step 2: (placeholder)</li>
            <li>Step 3: (placeholder)</li>
          </ul>
        </section>
      `
    };

    function getRoute() {
      const hash = location.hash || "#/home";
      const route = hash.replace(/^#\//, "");
      return route || "home";
    }

    function setActive(route) {
      document.querySelectorAll(".nav-item").forEach(a => {
        a.classList.toggle("active", a.dataset.route === route);
      });
    }

    function render() {
      const route = getRoute();
      const view = pages[route] || (() => `
        <section class="card">
          <h1 class="title">Not found</h1>
          <p class="muted">No page for route: <code>${route}</code></p>
        </section>
      `);

      document.getElementById("content").innerHTML = view();
      setActive(route);
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
